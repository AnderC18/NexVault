        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

            apiKey: "AIzaSyAhLOh8OfASKV8C0vxVEPm12eYLkxDCwM4",
            authDomain: "nexvault-a1328.firebaseapp.com",
            projectId: "nexvault-a1328",

            messagingSenderId: "976498340753",
            appId: "1:976498340753:web:deac488e94edde647a6030"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "nexvault", "data");
        window._fbGet = () => getDoc(docRef);
        window._fbSet = (data) => setDoc(docRef, { vault: data });
        window.dispatchEvent(new Event("fb-ready"));

let data = DATOS_PREDETERMINADOS;
let activeCat = null;
let activeSub = null;
let isAdmin = false;
let currentModalTarget = null;

function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }

async function initApp() {
    try {
        const snap = await window._fbGet();
        if (snap.exists()) {
            const fbData = snap.data().vault;
            // Si la versión en Firebase es antigua, actualizamos con los nuevos datos
            if (!fbData._version || fbData._version < DATA_VERSION) {
                data = DATOS_PREDETERMINADOS;
                await window._fbSet(DATOS_PREDETERMINADOS);
            } else {
                data = fbData;
            }
        } else {
            data = DATOS_PREDETERMINADOS;
            await window._fbSet(DATOS_PREDETERMINADOS);
        }
    } catch(e) {
        console.warn("Firebase error:", e);
        try { const r = localStorage.getItem("vault-data"); if(r) data = JSON.parse(r); } catch {}
    }
    if (data.categories?.length > 0) {
        activeCat = data.categories[0].id;
        activeSub = data.categories[0].subcategories?.[0]?.id || null;
    }
    document.getElementById("loadingScreen").style.display = "none";
    render();
}

window.addEventListener("fb-ready", initApp, { once: true });
setTimeout(() => { if(document.getElementById("loadingScreen").style.display !== "none") initApp(); }, 8000);

async function save(nd) {
    data = nd;
    const badge = document.getElementById("savingBadge");
    badge.style.display = "flex";
    try {
        await window._fbSet(nd);
        localStorage.setItem("vault-data", JSON.stringify(nd));
    } catch(e) { console.warn("Error guardando:", e); }
    badge.style.display = "none";
    render();
}

function render() { renderAdminUI(); renderCategories(); renderSubcategories(); renderLinks(); }

function renderAdminUI() {
    const banner = document.getElementById("adminBanner");
    const btnText = document.getElementById("adminBtnText");
    const btn = document.getElementById("adminBtn");
    const btnIcon = document.getElementById("adminIcon");
    if (isAdmin) {
        banner.style.display = "flex"; btnText.innerText = "Administrador activo";
        btn.style.background = "rgba(167,139,250,0.12)"; btn.style.borderColor = "rgba(167,139,250,0.4)";
        btn.style.color = "var(--purple-light)"; btnIcon.className = "ti ti-lock-open";
    } else {
        banner.style.display = "none"; btnText.innerText = "Administrador";
        btn.style.background = "rgba(255,255,255,0.04)"; btn.style.borderColor = "rgba(255,255,255,0.09)";
        btn.style.color = "var(--muted)"; btnIcon.className = "ti ti-lock";
    }
}

function renderCategories() {
    const container = document.getElementById("categoriesContainer");
    container.innerHTML = "";
    data.categories.forEach(cat => {
        const item = document.createElement("div"); item.className = "cat-item";
        const btn = document.createElement("button");
        btn.className = `cat-tab ${activeCat === cat.id ? 'active' : ''}`;
        btn.innerHTML = `<i class="ti ${cat.icon}" style="font-size:18px"></i> ${cat.name}`;
        btn.onclick = () => { activeCat = cat.id; activeSub = cat.subcategories[0]?.id || null; render(); };
        item.appendChild(btn);
        if (isAdmin) {
            const eg = document.createElement("div"); eg.className = "admin-edit-group";
            eg.innerHTML = `<button class="btn-edit" onclick="openCrudModal('editCategory','${cat.id}')"><i class="ti ti-pencil"></i></button><button class="btn-danger" onclick="delCategory('${cat.id}')"><i class="ti ti-trash"></i></button>`;
            item.appendChild(eg);
        }
        container.appendChild(item);
    });
    if (isAdmin) {
        const addBtn = document.createElement("button"); addBtn.className = "btn-ghost"; addBtn.style.borderStyle = "dashed";
        addBtn.innerHTML = `<i class="ti ti-plus" style="font-size:14px"></i> Categoría`;
        addBtn.onclick = () => openCrudModal('addCategory');
        container.appendChild(addBtn);
    }
}

function renderSubcategories() {
    const container = document.getElementById("subcategoriesContainer"); container.innerHTML = "";
    const curCat = data.categories.find(c => c.id === activeCat);
    if (!curCat) return;
    curCat.subcategories.forEach(sub => {
        const item = document.createElement("div"); item.className = "subcat-item";
        const btn = document.createElement("button");
        btn.className = `sub-pill ${activeSub === sub.id ? 'active' : ''}`;
        btn.innerText = sub.name;
        btn.onclick = () => { activeSub = sub.id; render(); };
        item.appendChild(btn);
        if (isAdmin) {
            const eg = document.createElement("div"); eg.className = "admin-edit-group";
            eg.innerHTML = `<button class="btn-edit" onclick="openCrudModal('editSubcat','${curCat.id}','${sub.id}')"><i class="ti ti-pencil"></i></button><button class="btn-danger" onclick="delSubcat('${curCat.id}','${sub.id}')"><i class="ti ti-trash"></i></button>`;
            item.appendChild(eg);
        }
        container.appendChild(item);
    });
    if (isAdmin) {
        const addBtn = document.createElement("button");
        addBtn.style = "padding:6px 16px;border-radius:20px;border:1px dashed rgba(37,99,235,0.3);background:rgba(37,99,235,0.06);cursor:pointer;font-size:12px;color:rgba(147,197,253,0.6);display:inline-flex;align-items:center;gap:5px;";
        addBtn.innerHTML = `<i class="ti ti-plus" style="font-size:12px"></i> Subcarpeta`;
        addBtn.onclick = () => openCrudModal('addSubcat', curCat.id);
        container.appendChild(addBtn);
    }
}

function renderLinks() {
    const area = document.getElementById("linksArea"); area.innerHTML = "";
    const curCat = data.categories.find(c => c.id === activeCat);
    const curSub = curCat ? curCat.subcategories.find(s => s.id === activeSub) : null;
    if (curSub) {
        const headerDiv = document.createElement("div"); headerDiv.className = "links-header";
        headerDiv.innerHTML = `<span class="links-count">${curSub.links.length} ${curSub.links.length === 1 ? 'archivo' : 'archivos'}</span>`;
        if (isAdmin) {
            const addBtn = document.createElement("button"); addBtn.className = "btn-primary";
            addBtn.innerHTML = `<i class="ti ti-plus" style="font-size:14px"></i> Agregar enlace`;
            addBtn.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
            headerDiv.appendChild(addBtn);
        }
        area.appendChild(headerDiv);
        if (curSub.links.length === 0) {
            const empty = document.createElement("div"); empty.className = "empty-state";
            empty.innerHTML = `<i class="ti ti-inbox" style="font-size:44px;display:block;margin-bottom:14px"></i><div style="font-size:14px;margin-bottom:22px">Esta carpeta está vacía</div>`;
            if (isAdmin) {
                const fb = document.createElement("button"); fb.className = "btn-primary"; fb.style.margin = "0 auto";
                fb.innerHTML = `<i class="ti ti-plus" style="font-size:14px"></i> Agregar primer enlace`;
                fb.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
                empty.appendChild(fb);
            }
            area.appendChild(empty);
        } else {
            const grid = document.createElement("div"); grid.className = "links-grid";
            curSub.links.forEach(link => {
                const card = document.createElement("div"); card.className = "link-card";
                card.innerHTML = `
                    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
                        <div class="link-title">${link.name}</div>
                        <i class="ti ti-file" style="font-size:18px;color:var(--muted);flex-shrink:0;margin-top:1px"></i>
                    </div>
                    ${link.description ? `<p class="link-desc">${link.description}</p>` : ''}
                `;
                const actions = document.createElement("div"); actions.className = "link-actions";
                actions.innerHTML = `<a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn-open"><i class="ti ti-external-link" style="font-size:13px"></i> Abrir</a>`;
                if (isAdmin) {
                    const ab = document.createElement("div"); ab.style = "display:flex;gap:6px";
                    ab.innerHTML = `<button class="btn-edit" onclick="openCrudModal('editLink','${curCat.id}','${curSub.id}','${link.id}')"><i class="ti ti-pencil"></i> Editar</button><button class="btn-danger" onclick="delLink('${curCat.id}','${curSub.id}','${link.id}')"><i class="ti ti-trash"></i></button>`;
                    actions.appendChild(ab);
                }
                card.appendChild(actions);
                grid.appendChild(card);
            });
            if (isAdmin) {
                const ph = document.createElement("div"); ph.className = "add-card-placeholder"; ph.style.display = "flex";
                ph.innerHTML = `<i class="ti ti-plus" style="font-size:28px"></i>Agregar enlace`;
                ph.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
                grid.appendChild(ph);
            }
            area.appendChild(grid);
        }
    } else if (curCat) {
        const empty = document.createElement("div"); empty.className = "empty-state";
        empty.innerHTML = `<i class="ti ti-folder-open" style="font-size:44px;display:block;margin-bottom:14px"></i><div style="font-size:14px;margin-bottom:22px">Esta categoría no tiene subcarpetas</div>`;
        if (isAdmin) {
            const ms = document.createElement("button"); ms.className = "btn-primary"; ms.style.margin = "0 auto";
            ms.innerHTML = `<i class="ti ti-plus" style="font-size:14px"></i> Crear subcarpeta`;
            ms.onclick = () => openCrudModal('addSubcat', curCat.id);
            empty.appendChild(ms);
        }
        area.appendChild(empty);
    } else {
        const empty = document.createElement("div"); empty.className = "empty-state";
        empty.innerHTML = `<i class="ti ti-galaxy" style="font-size:44px;display:block;margin-bottom:14px"></i><div style="font-size:14px;margin-bottom:22px">No hay categorías todavía</div>`;
        area.appendChild(empty);
    }
}

function toggleAdminMode() {
    if (isAdmin) { isAdmin = false; render(); }
    else { document.getElementById("loginModal").style.display = "flex"; setTimeout(() => document.getElementById("pwInput").focus(), 100); }
}
function handleLogin() {
    const input = document.getElementById("pwInput"); const err = document.getElementById("pwError");
    if (input.value === ADMIN_PASSWORD) { isAdmin = true; closeModal("loginModal"); input.value = ""; err.style.display = "none"; render(); }
    else { err.innerText = "Contraseña incorrecta."; err.style.display = "block"; }
}
function logoutAdmin() { isAdmin = false; render(); }
function openExportModal() {
    document.getElementById("exportJsonBox").innerText = JSON.stringify(data, null, 2);
    document.getElementById("exportModal").style.display = "flex";
}
function doCopyConfig() {
    navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
        const btn = document.getElementById("copyBtn");
        btn.innerHTML = `<i class="ti ti-check"></i> ¡Copiado!`;
        setTimeout(() => { btn.innerHTML = `<i class="ti ti-copy"></i> Copiar todo`; }, 2000);
    });
}
function closeModal(id) {
    document.getElementById(id).style.display = "none";
    if (id === 'loginModal') { document.getElementById("pwError").style.display = "none"; document.getElementById("pwInput").value = ""; }
}

const modalTitles = { addCategory:"Nueva categoría", editCategory:"Editar categoría", addSubcat:"Nueva subcarpeta", editSubcat:"Editar subcarpeta", addLink:"Nuevo enlace", editLink:"Editar enlace" };

function openCrudModal(type, catId=null, subId=null, linkId=null) {
    currentModalTarget = { type, catId, subId, linkId };
    document.getElementById("crudModalTitle").innerText = modalTitles[type];
    const inp = document.getElementById("crudInputs"); inp.innerHTML = "";
    let initName="", initIcon="", initUrl="", initDesc="";
    if (type==="editCategory") { const c=data.categories.find(x=>x.id===catId); initName=c?.name||""; initIcon=c?.icon||""; }
    else if (type==="editSubcat") { const c=data.categories.find(x=>x.id===catId); const s=c?.subcategories.find(x=>x.id===subId); initName=s?.name||""; }
    else if (type==="editLink") { const c=data.categories.find(x=>x.id===catId); const s=c?.subcategories.find(x=>x.id===subId); const l=s?.links.find(x=>x.id===linkId); initName=l?.name||""; initUrl=l?.url||""; initDesc=l?.description||""; }
    if (type==="addCategory"||type==="editCategory") {
        inp.innerHTML = `<div class="form-group"><label class="label-style">Nombre</label><input id="formName" class="input-style" placeholder="Ej: Música, Fotos..." value="${initName}"></div><div class="form-group"><label class="label-style">Ícono Tabler</label><input id="formIcon" class="input-style" placeholder="ti-device-gamepad-2" value="${initIcon}"><p style="font-size:11px;color:var(--muted);margin-top:6px">Ej: ti-school · ti-briefcase · ti-music · ti-code</p></div>`;
    } else if (type==="addSubcat"||type==="editSubcat") {
        inp.innerHTML = `<div class="form-group"><label class="label-style">Nombre de la subcarpeta</label><input id="formName" class="input-style" placeholder="Ej: Versiones, Apuntes..." value="${initName}"></div>`;
    } else if (type==="addLink"||type==="editLink") {
        inp.innerHTML = `<div class="form-group"><label class="label-style">Nombre</label><input id="formName" class="input-style" placeholder="Ej: Minecraft 1.20.4" value="${initName}"></div><div class="form-group"><label class="label-style">URL / Enlace</label><input id="formUrl" class="input-style" placeholder="https://..." value="${initUrl}"></div><div class="form-group"><label class="label-style">Descripción (opcional)</label><input id="formDesc" class="input-style" placeholder="Breve descripción..." value="${initDesc}"></div>`;
    }
    document.getElementById("crudModal").style.display = "flex";
    setTimeout(() => { const f=document.getElementById("formName"); if(f) f.focus(); }, 100);
}

function submitCrudModal() {
    if (!currentModalTarget) return;
    const { type, catId, subId, linkId } = currentModalTarget;
    const nd = JSON.parse(JSON.stringify(data));
    const nameVal = document.getElementById("formName")?.value || "";
    const iconVal = document.getElementById("formIcon")?.value || "";
    const urlVal  = document.getElementById("formUrl")?.value  || "";
    const descVal = document.getElementById("formDesc")?.value || "";
    switch(type) {
        case "addCategory": if(!nameVal) return; nd.categories.push({id:genId(),name:nameVal,icon:iconVal||"ti-folder",subcategories:[]}); break;
        case "editCategory": { const c=nd.categories.find(x=>x.id===catId); if(c){c.name=nameVal||c.name;c.icon=iconVal||c.icon;} break; }
        case "addSubcat": { if(!nameVal) return; const c=nd.categories.find(x=>x.id===catId); const ns={id:genId(),name:nameVal,links:[]}; if(c){c.subcategories.push(ns);activeSub=ns.id;} break; }
        case "editSubcat": { const c=nd.categories.find(x=>x.id===catId); const s=c?.subcategories.find(x=>x.id===subId); if(s) s.name=nameVal||s.name; break; }
        case "addLink": { if(!nameVal||!urlVal) return; const c=nd.categories.find(x=>x.id===catId); const s=c?.subcategories.find(x=>x.id===subId); if(s) s.links.push({id:genId(),name:nameVal,url:urlVal,description:descVal}); break; }
        case "editLink": { const c=nd.categories.find(x=>x.id===catId); const s=c?.subcategories.find(x=>x.id===subId); const l=s?.links.find(x=>x.id===linkId); if(l){l.name=nameVal||l.name;l.url=urlVal||l.url;l.description=descVal??l.description;} break; }
    }
    save(nd);
    closeModal("crudModal");
}

function delCategory(catId) {
    if (!confirm("¿Eliminar esta categoría y todo su contenido?")) return;
    const nd={...data,categories:data.categories.filter(c=>c.id!==catId)};
    if(activeCat===catId){activeCat=nd.categories[0]?.id||null;activeSub=nd.categories[0]?.subcategories[0]?.id||null;}
    save(nd);
}
function delSubcat(catId,subId) {
    if (!confirm("¿Eliminar esta subcarpeta?")) return;
    const nd=JSON.parse(JSON.stringify(data));
    const c=nd.categories.find(x=>x.id===catId);
    if(c){c.subcategories=c.subcategories.filter(s=>s.id!==subId);if(activeSub===subId)activeSub=c.subcategories[0]?.id||null;}
    save(nd);
}
function delLink(catId,subId,linkId) {
    if (!confirm("¿Eliminar este enlace?")) return;
    const nd=JSON.parse(JSON.stringify(data));
    const c=nd.categories.find(x=>x.id===catId);
    const s=c?.subcategories.find(x=>x.id===subId);
    if(s) s.links=s.links.filter(l=>l.id!==linkId);
    save(nd);
}
</script>
</body>
</html>
