<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexVault</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
    <style>
        :root {
            --bg: #06060F;
            --surface: rgba(255, 255, 255, 0.035);
            --surface-hover: rgba(255, 255, 255, 0.065);
            --border: rgba(255, 255, 255, 0.07);
            --purple: #7C3AED;
            --purple-light: #A78BFA;
            --blue: #2563EB;
            --blue-light: #93C5FD;
            --white: #EEF0FF;
            --muted: rgba(238, 240, 255, 0.45);
            --danger: #F87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --danger-border: rgba(248, 113, 113, 0.25);
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: system-ui, -apple-system, sans-serif;
            color: var(--white);
            position: relative;
            overflow-x: hidden;
        }

        /* Animaciones de Nebulosa */
        @keyframes nebDrift1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(50px,-40px) scale(1.12)} }
        @keyframes nebDrift2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-60px,50px) scale(1.08)} }
        @keyframes nebDrift3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(30px,30px) scale(1.05)} }
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

        .nebula-1 { position: fixed; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(124,58,237,0.28) 0%, transparent 70%); top: -200px; right: -150px; filter: blur(50px); animation: nebDrift1 14s ease-in-out infinite; pointer-events: none; z-index: 0; }
        .nebula-2 { position: fixed; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(37,99,235,0.22) 0%, transparent 70%); bottom: -150px; left: -120px; filter: blur(60px); animation: nebDrift2 18s ease-in-out infinite; pointer-events: none; z-index: 0; }
        .nebula-3 { position: fixed; width: 350px; height: 350px; border-radius: 50%; background: radial-gradient(circle, rgba(167,139,250,0.15) 0%, transparent 70%); top: 45%; left: 38%; filter: blur(70px); animation: nebDrift3 22s ease-in-out infinite; pointer-events: none; z-index: 0; }

        .main-container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 28px 24px 100px; }
        
        /* Encabezado */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-title { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, var(--purple-light), var(--blue-light)); -webkit-background-clip: text; -webkit-text-fillColor: transparent; letter-spacing: -0.5px; }
        
        /* Botones */
        .btn-group { display: flex; gap: 10px; }
        .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--white); }
        .btn-primary { background: linear-gradient(135deg, #7C3AED 0%, #2563EB 100%); border: none; color: #fff; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
        .btn-edit { background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.3); color: var(--purple-light); padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
        .btn-danger { background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }

        /* Banner Admin */
        .admin-banner { display: none; background: rgba(167,139,250,0.08); border: 1px solid rgba(167,139,250,0.2); border-radius: 10px; padding: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 28px; font-size: 13px; color: var(--purple-light); animation: fadeUp 0.28s ease both; }

        /* Estructura de Listas/Tabs */
        .tabs-container, .subcats-container { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; align-items: center; }
        .subcats-container { margin-bottom: 32px; }
        
        .cat-item, .subcat-item { display: flex; align-items: center; gap: 6px; }
        .admin-edit-group { display: none; gap: 4px; }
        .cat-item:hover .admin-edit-group, .subcat-item:hover .admin-edit-group { display: flex; }

        .cat-tab { display: flex; align-items: center; gap: 9px; padding: 10px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 500; color: var(--muted); transition: all 0.18s; }
        .cat-tab.active { border-color: rgba(167,139,250,0.45); background: rgba(124,58,237,0.18); color: var(--white); box-shadow: 0 0 24px rgba(124,58,237,0.2); }
        .cat-tab:hover:not(.active) { background: rgba(255,255,255,0.06); border-color: rgba(167,139,250,0.2); color: var(--white); }

        .sub-pill { padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); transition: all 0.18s; }
        .sub-pill.active { border-color: rgba(37,99,235,0.4); background: rgba(37,99,235,0.14); color: var(--blue-light); }
        .sub-pill:hover:not(.active) { background: rgba(255,255,255,0.06); }

        /* Links */
        .links-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .links-count { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; animation: fadeUp 0.28s ease both; }
        
        .link-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; backdrop-filter: blur(12px); display: flex; flexDirection: column; gap: 10px; transition: all 0.22s ease; }
        .link-card:hover { background: rgba(255,255,255,0.065); border-color: rgba(167,139,250,0.25); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(124,58,237,0.18); }
        .link-title { font-size: 15px; font-weight: 600; color: var(--white); line-height: 1.3; display: flex; justify-content: space-between; width: 100%; }
        .link-desc { font-size: 12px; color: var(--muted); lineHeight: 1.55; margin: 8px 0 12px 0; }
        .link-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; }
        .btn-open { background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.3); color: var(--blue-light); padding: 7px 15px; border-radius: 8px; cursor: pointer; font-family: monospace; font-size: 12px; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
        .btn-open:hover { background: rgba(37,99,235,0.25); color: #BFDBFE; }

        .add-card-placeholder { background: rgba(124,58,237,0.05); border: 2px dashed rgba(124,58,237,0.2); border-radius: 14px; padding: 24px; cursor: pointer; text-align: center; color: rgba(167,139,250,0.55); font-size: 13px; display: none; flex-direction: column; align-items: center; gap: 8px; transition: all 0.2s; }
        .add-card-placeholder:hover { background: rgba(124,58,237,0.1); color: var(--purple-light); }

        .empty-state { text-align: center; padding: 70px 20px; color: rgba(238,240,255,0.25); animation: fadeUp 0.28s ease both; }

        /* Modales */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
        .modal-content { background: #0D0D1C; border: 1px solid rgba(167,139,250,0.25); border-radius: 18px; padding: 32px; width: 100%; maxWidth: 430px; box-shadow: 0 24px 70px rgba(0,0,0,0.6); }
        .modal-title { font-size: 19px; font-weight: 700; background: linear-gradient(90deg, var(--purple-light), var(--blue-light)); -webkit-background-clip: text; -webkit-text-fillColor: transparent; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 16px; }
        .label-style { display: block; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; marginBottom: 7px; margin-bottom: 6px; }
        .input-style { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 10px 14px; color: var(--white); font-size: 14px; outline: none; box-sizing: border-box; }
        .input-style:focus { border-color: rgba(167,139,250,0.5); }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

        .export-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: monospace; font-size: 11px; color: rgba(238,240,255,0.65); maxHeight: 280px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin-bottom: 18px; text-align: left; }
        
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: rgba(167,139,250,0.3); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="nebula-1"></div>
    <div class="nebula-2"></div>
    <div class="nebula-3"></div>

    <div class="main-container">
        <div class="header">
            <div class="brand">
                <svg viewBox="0 0 48 48" width="46" height="46" style="filter: drop-shadow(0 0 10px rgba(124,58,237,0.55))">
                    <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" fill="#7C3AED"/>
                    <path d="M28 11 L19 25 H24.5 L20 37 L31 22 H25.5 Z" fill="white"/>
                </svg>
                <div>
                    <div class="brand-title">NexVault</div>
                    <div style="font-size: 12px; color: var(--muted); margin-top: 1px;">Tu hub de juegos y personal</div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn-ghost" onclick="openExportModal()">
                    <i class="ti ti-upload" style="font-size: 15px"></i> Exportar configuración
                </button>
                <button class="btn-ghost" id="adminBtn" onclick="toggleAdminMode()">
                    <i class="ti ti-lock" id="adminIcon" style="font-size: 15px"></i> <span id="adminBtnText">Administrador</span>
                </button>
            </div>
        </div>

        <div class="admin-banner" id="adminBanner">
            <span><i class="ti ti-sparkles" style="font-size: 15px; margin-right: 7px;"></i>Modo administrador — edita, agrega y elimina lo que quieras</span>
            <button class="btn-ghost" style="padding: 4px 12px; font-size: 12px;" onclick="logoutAdmin()">Salir</button>
        </div>

        <div class="tabs-container" id="categoriesContainer"></div>

        <div class="subcats-container" id="subcategoriesContainer"></div>

        <div id="linksArea"></div>
    </div>

    <div class="modal-overlay" id="loginModal" onclick="closeModal('loginModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title"><i class="ti ti-lock" style="margin-right: 8px;"></i>Acceso de administrador</div>
            <div class="form-group">
                <label class="label-style">Contraseña</label>
                <input type="password" id="pwInput" class="input-style" placeholder="Ingresa tu contraseña" onkeydown="if(event.key==='Enter') handleLogin()">
                <p id="pwError" style="color: var(--danger); font-size: 12px; marginTop: 7px; display: none;"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-ghost" onclick="closeModal('loginModal')">Cancelar</button>
                <button class="btn-primary" onclick="handleLogin()">Entrar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="crudModal" onclick="closeModal('crudModal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="crudModalTitle">Operación</div>
            <div id="crudInputs"></div>
            <div class="modal-footer">
                <button class="btn-ghost" onclick="closeModal('crudModal')">Cancelar</button>
                <button class="btn-primary" onclick="submitCrudModal()">Guardar</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="exportModal" onclick="closeModal('exportModal')">
        <div class="modal-content" style="max-width: 540px;" onclick="event.stopPropagation()">
            <div class="modal-title"><i class="ti ti-upload" style="margin-right: 8px;"></i>Exportar configuración</div>
            <p style="font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.65;">
                Copia esto y pégalo en el chat cuando quieras que yo haga cambios. Así sabré exactamente cómo está tu Vault.
            </p>
            <div class="export-box" id="exportJsonBox"></div>
            <div class="modal-footer">
                <button class="btn-ghost" onclick="closeModal('exportModal')">Cerrar</button>
                <button class="btn-primary" id="copyBtn" onclick="doCopyConfig()">
                    <i class="ti ti-copy" style="font-size: 14px"></i> Copiar todo
                </button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "Kendall2026$";

        const DATOS_PREDETERMINADOS = {
            categories: [
                {
                    id: "juegos", name: "Juegos", icon: "ti-device-gamepad-2",
                    subcategories: [
                        {
                            id: "mc-versiones", name: "Versiones de Minecraft",
                            links: [
                                { id: "mc1", name: "Minecraft Java 1.20.4", url: "https://www.minecraft.net/es-es/download", description: "Versión más reciente estable" },
                                { id: "mc2", name: "Minecraft Java 1.19.4", url: "https://www.minecraft.net/es-es/download", description: "Compatible con más mods" }
                            ]
                        },
                        { id: "mc-mods", name: "Mods de Minecraft", links: [] }
                    ]
                },
                {
                    id: "universidad", name: "Universidad", icon: "ti-school",
                    subcategories: [
                        { id: "uni-apuntes", name: "Apuntes", links: [] },
                        { id: "uni-proyectos", name: "Proyectos", links: [] }
                    ]
                },
                {
                    id: "trabajo", name: "Trabajo", icon: "ti-briefcase",
                    subcategories: [
                        { id: "work-docs", name: "Documentos", links: [] }
                    ]
                }
            ]
        };

        let data = DATOS_PREDETERMINADOS;
        let activeCat = null;
        let activeSub = null;
        let isAdmin = false;
        let currentModalTarget = null; // Guarda metadatos para el CRUD modal

        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            try {
                const r = localStorage.getItem("vault-data");
                data = r ? JSON.parse(r) : DATOS_PREDETERMINADOS;
            } catch (e) {
                data = DATOS_PREDETERMINADOS;
            }
            if (data.categories && data.categories.length > 0) {
                activeCat = data.categories[0].id;
                if (data.categories[0].subcategories && data.categories[0].subcategories.length > 0) {
                    activeSub = data.categories[0].subcategories[0].id;
                }
            }
            render();
        });

        function save(nd) {
            data = nd;
            try { localStorage.setItem("vault-data", JSON.stringify(nd)); } catch(e) {}
            render();
        }

        // Sistema de Renderizado Dinámico (Reemplazo de React)
        function render() {
            renderAdminUI();
            renderCategories();
            renderSubcategories();
            renderLinks();
        }

        function renderAdminUI() {
            const banner = document.getElementById("adminBanner");
            const btnText = document.getElementById("adminBtnText");
            const btnIcon = document.getElementById("adminIcon");
            const btn = document.getElementById("adminBtn");

            if (isAdmin) {
                banner.style.display = "flex";
                btnText.innerText = "Administrador activo";
                btn.style.background = "rgba(167,139,250,0.12)";
                btn.style.borderColor = "rgba(167,139,250,0.4)";
                btn.style.color = "var(--purple-light)";
                btnIcon.className = "ti ti-lock-open";
            } else {
                banner.style.display = "none";
                btnText.innerText = "Administrador";
                btn.style.background = "rgba(255,255,255,0.04)";
                btn.style.borderColor = "rgba(255,255,255,0.09)";
                btn.style.color = "var(--muted)";
                btnIcon.className = "ti ti-lock";
            }
        }

        function renderCategories() {
            const container = document.getElementById("categoriesContainer");
            container.innerHTML = "";

            data.categories.forEach(cat => {
                const item = document.createElement("div");
                item.className = "cat-item";
                
                const btn = document.createElement("button");
                btn.className = `cat-tab ${activeCat === cat.id ? 'active' : ''}`;
                btn.innerHTML = `<i class="ti ${cat.icon}" style="font-size: 18px"></i> ${cat.name}`;
                btn.onclick = () => {
                    activeCat = cat.id;
                    activeSub = cat.subcategories[0] ? cat.subcategories[0].id : null;
                    render();
                };
                item.appendChild(btn);

                if (isAdmin) {
                    const editGroup = document.createElement("div");
                    editGroup.className = "admin-edit-group";
                    editGroup.innerHTML = `
                        <button class="btn-edit" onclick="openCrudModal('editCategory', '${cat.id}')"><i class="ti ti-pencil"></i></button>
                        <button class="btn-danger" onclick="delCategory('${cat.id}')"><i class="ti ti-trash"></i></button>
                    `;
                    item.appendChild(editGroup);
                }
                container.appendChild(item);
            });

            if (isAdmin) {
                const addBtn = document.createElement("button");
                addBtn.className = "btn-ghost";
                addBtn.style.borderStyle = "dashed";
                addBtn.innerHTML = `<i class="ti ti-plus" style="font-size: 14px"></i> Categoría`;
                addBtn.onclick = () => openCrudModal('addCategory');
                container.appendChild(addBtn);
            }
        }

        function renderSubcategories() {
            const container = document.getElementById("subcategoriesContainer");
            container.innerHTML = "";

            const curCat = data.categories.find(c => c.id === activeCat);
            if (!curCat) return;

            curCat.subcategories.forEach(sub => {
                const item = document.createElement("div");
                item.className = "subcat-item";

                const btn = document.createElement("button");
                btn.className = `sub-pill ${activeSub === sub.id ? 'active' : ''}`;
                btn.innerText = sub.name;
                btn.onclick = () => {
                    activeSub = sub.id;
                    render();
                };
                item.appendChild(btn);

                if (isAdmin) {
                    const editGroup = document.createElement("div");
                    editGroup.className = "admin-edit-group";
                    editGroup.innerHTML = `
                        <button class="btn-edit" onclick="openCrudModal('editSubcat', '${curCat.id}', '${sub.id}')"><i class="ti ti-pencil"></i></button>
                        <button class="btn-danger" onclick="delSubcat('${curCat.id}', '${sub.id}')"><i class="ti ti-trash"></i></button>
                    `;
                    item.appendChild(editGroup);
                }
                container.appendChild(item);
            });

            if (isAdmin) {
                const addBtn = document.createElement("button");
                addBtn.style = "padding: 6px 16px; border-radius: 20px; border: 1px dashed rgba(37,99,235,0.3); background: rgba(37,99,235,0.06); cursor: pointer; font-size: 12px; color: rgba(147,197,253,0.6); display: inline-flex; align-items: center; gap: 5px;";
                addBtn.innerHTML = `<i class="ti ti-plus" style="font-size: 12px"></i> Subcarpeta`;
                addBtn.onclick = () => openCrudModal('addSubcat', curCat.id);
                container.appendChild(addBtn);
            }
        }

        function renderLinks() {
            const area = document.getElementById("linksArea");
            area.innerHTML = "";

            const curCat = data.categories.find(c => c.id === activeCat);
            const curSub = curCat ? curCat.subcategories.find(s => s.id === activeSub) : null;

            if (curSub) {
                // Cabecera superior
                const headerDiv = document.createElement("div");
                headerDiv.className = "links-header";
                headerDiv.innerHTML = `<span class="links-count">${curSub.links.length} ${curSub.links.length === 1 ? 'archivo' : 'archivos'}</span>`;
                
                if (isAdmin) {
                    const addBtn = document.createElement("button");
                    addBtn.className = "btn-primary";
                    addBtn.innerHTML = `<i class="ti ti-plus" style="font-size: 14px"></i> Agregar enlace`;
                    addBtn.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
                    headerDiv.appendChild(addBtn);
                }
                area.appendChild(headerDiv);

                if (curSub.links.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-state";
                    empty.innerHTML = `
                        <i class="ti ti-inbox" style="font-size: 44px; display: block; margin-bottom: 14px"></i>
                        <div style="font-size: 14px; margin-bottom: 22px">Esta carpeta está vacía</div>
                    `;
                    if (isAdmin) {
                        const firstBtn = document.createElement("button");
                        firstBtn.className = "btn-primary";
                        firstBtn.style.margin = "0 auto";
                        firstBtn.innerHTML = `<i class="ti ti-plus" style="font-size: 14px"></i> Agregar primer enlace`;
                        firstBtn.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
                        empty.appendChild(firstBtn);
                    }
                    area.appendChild(empty);
                } else {
                    const grid = document.createElement("div");
                    grid.className = "links-grid";

                    curSub.links.forEach(link => {
                        const card = document.createElement("div");
                        card.className = "link-card";
                        
                        card.innerHTML = `
                            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                                <div class="link-title">${link.name}</div>
                                <i class="ti ti-file" style="font-size: 18px; color: var(--muted); flex-shrink: 0; margin-top: 1px;"></i>
                            </div>
                            ${link.description ? `<p class="link-desc">${link.description}</p>` : '<div style="margin-top:10px;"></div>'}
                        `;

                        const actions = document.createElement("div");
                        actions.className = "link-actions";
                        actions.innerHTML = `
                            <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="btn-open">
                                <i class="ti ti-external-link" style="font-size: 13px"></i> Abrir
                            </a>
                        `;

                        if (isAdmin) {
                            const adminButtons = document.createElement("div");
                            adminButtons.style.display = "flex";
                            adminButtons.style.gap = "6px";
                            adminButtons.innerHTML = `
                                <button class="btn-edit" onclick="openCrudModal('editLink', '${curCat.id}', '${curSub.id}', '${link.id}')"><i class="ti ti-pencil"></i> Editar</button>
                                <button class="btn-danger" onclick="delLink('${curCat.id}', '${curSub.id}', '${link.id}')"><i class="ti ti-trash"></i></button>
                            `;
                            actions.appendChild(adminButtons);
                        }

                        card.appendChild(actions);
                        grid.appendChild(card);
                    });

                    if (isAdmin) {
                        const placeholder = document.createElement("div");
                        placeholder.className = "add-card-placeholder";
                        placeholder.style.display = "flex";
                        placeholder.innerHTML = `<i class="ti ti-plus" style="font-size: 28px"></i>Agregar enlace`;
                        placeholder.onclick = () => openCrudModal('addLink', curCat.id, curSub.id);
                        grid.appendChild(placeholder);
                    }

                    area.appendChild(grid);
                }

            } else if (curCat) {
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.innerHTML = `
                    <i class="ti ti-folder-open" style="font-size: 44px; display: block; margin-bottom: 14px"></i>
                    <div style="font-size: 14px; margin-bottom: 22px">Esta categoría no tiene subcarpetas</div>
                `;
                if (isAdmin) {
                    const makeSub = document.createElement("button");
                    makeSub.className = "btn-primary";
                    makeSub.style.margin = "0 auto";
                    makeSub.innerHTML = `<i class="ti ti-plus" style="font-size: 14px"></i> Crear subcarpeta`;
                    makeSub.onclick = () => openCrudModal('addSubcat', curCat.id);
                    empty.appendChild(makeSub);
                }
                area.appendChild(empty);
            } else {
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.innerHTML = `
                    <i class="ti ti-galaxy" style="font-size: 44px; display: block; margin-bottom: 14px"></i>
                    <div style="font-size: 14px; margin-bottom: 22px">No hay categorías todavía</div>
                `;
                if (isAdmin) {
                    const makeCat = document.createElement("button");
                    makeCat.className = "btn-primary";
                    makeCat.style.margin = "0 auto";
                    makeCat.innerHTML = `<i class="ti ti-plus" style="font-size: 14px"></i> Crear categoría`;
                    makeCat.onclick = () => openCrudModal('addCategory');
                    empty.appendChild(makeCat);
                }
                area.appendChild(empty);
            }
        }

        // Lógica de Modales de Autenticación
        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                render();
            } else {
                document.getElementById("loginModal").style.display = "flex";
                document.getElementById("pwInput").focus();
            }
        }

        function handleLogin() {
            const input = document.getElementById("pwInput");
            const err = document.getElementById("pwError");
            if (input.value === ADMIN_PASSWORD) {
                isAdmin = true;
                closeModal("loginModal");
                input.value = "";
                err.style.display = "none";
                render();
            } else {
                err.innerText = "Contraseña incorrecta. Inténtalo de nuevo.";
                err.style.display = "block";
            }
        }

        function logoutAdmin() {
            isAdmin = false;
            render();
        }

        function openExportModal() {
            document.getElementById("exportJsonBox").innerText = JSON.stringify(data, null, 2);
            document.getElementById("exportModal").style.display = "flex";
        }

        function doCopyConfig() {
            const jsonText = JSON.stringify(data, null, 2);
            navigator.clipboard.writeText(jsonText).then(() => {
                const copyBtn = document.getElementById("copyBtn");
                copyBtn.innerHTML = `<i class="ti ti-check"></i> ¡Copiado!`;
                setTimeout(() => {
                    copyBtn.innerHTML = `<i class="ti ti-copy"></i> Copiar todo`;
                }, 2000);
            });
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
            if(id === 'loginModal') {
                document.getElementById("pwError").style.display = "none";
                document.getElementById("pwInput").value = "";
            }
        }

        // CONTROL CRUD (Inyección de Inputs Dinámicos)
        const modalTitles = {
            addCategory: "Nueva categoría",
            editCategory: "Editar categoría",
            addSubcat: "Nueva subcarpeta",
            editSubcat: "Editar subcarpeta",
            addLink: "Nuevo enlace",
            editLink: "Editar enlace",
        };

        function openCrudModal(type, catId = null, subId = null, linkId = null) {
            currentModalTarget = { type, catId, subId, linkId };
            document.getElementById("crudModalTitle").innerText = modalTitles[type];
            
            const inputContainer = document.getElementById("crudInputs");
            inputContainer.innerHTML = "";

            let initName = "", initIcon = "", initUrl = "", initDesc = "";

            if (type === "editCategory") {
                const c = data.categories.find(x => x.id === catId);
                initName = c ? c.name : "";
                initIcon = c ? c.icon : "";
            } else if (type === "editSubcat") {
                const c = data.categories.find(x => x.id === catId);
                const s = c ? c.subcategories.find(x => x.id === subId) : null;
                initName = s ? s.name : "";
            } else if (type === "editLink") {
                const c = data.categories.find(x => x.id === catId);
                const s = c ? c.subcategories.find(x => x.id === subId) : null;
                const l = s ? s.links.find(x => x.id === linkId) : null;
                initName = l ? l.name : "";
                initUrl = l ? l.url : "";
                initDesc = l ? l.description : "";
            }

            if (type === "addCategory" || type === "editCategory") {
                inputContainer.innerHTML = `
                    <div class="form-group">
                        <label class="label-style">Nombre</label>
                        <input id="formName" class="input-style" placeholder="Ej: Juegos, Música..." value="${initName}">
                    </div>
                    <div class="form-group">
                        <label class="label-style">Ícono Tabler (clase)</label>
                        <input id="formIcon" class="input-style" placeholder="ti-device-gamepad-2" value="${initIcon}">
                        <p style="font-size: 11px; color: var(--muted); margin-top: 6px;">Ej: ti-school · ti-briefcase · ti-code</p>
                    </div>
                `;
            } else if (type === "addSubcat" || type === "editSubcat") {
                inputContainer.innerHTML = `
                    <div class="form-group">
                        <label class="label-style">Nombre de la subcarpeta</label>
                        <input id="formName" class="input-style" placeholder="Ej: Versiones, Apuntes..." value="${initName}">
                    </div>
                `;
            } else if (type === "addLink" || type === "editLink") {
                inputContainer.innerHTML = `
                    <div class="form-group">
                        <label class="label-style">Nombre</label>
                        <input id="formName" class="input-style" placeholder="Ej: Minecraft 1.20.4" value="${initName}">
                    </div>
                    <div class="form-group">
                        <label class="label-style">URL / Enlace</label>
                        <input id="formUrl" class="input-style" placeholder="https://..." value="${initUrl}">
                    </div>
                    <div class="form-group">
                        <label class="label-style">Descripción (opcional)</label>
                        <input id="formDesc" class="input-style" placeholder="Breve descripción..." value="${initDesc}">
                    </div>
                `;
            }

            document.getElementById("crudModal").style.display = "flex";
            const focusInput = document.getElementById("formName");
            if(focusInput) focusInput.focus();
        }

        function submitCrudModal() {
            if (!currentModalTarget) return;
            const { type, catId, subId, linkId } = currentModalTarget;
            const nd = JSON.parse(JSON.stringify(data));

            const nameVal = document.getElementById("formName") ? document.getElementById("formName").value : "";
            const iconVal = document.getElementById("formIcon") ? document.getElementById("formIcon").value : "";
            const urlVal = document.getElementById("formUrl") ? document.getElementById("formUrl").value : "";
            const descVal = document.getElementById("formDesc") ? document.getElementById("formDesc").value : "";

            switch (type) {
                case "addCategory":
                    if (!nameVal) return;
                    nd.categories.push({ id: genId(), name: nameVal, icon: iconVal || "ti-folder", subcategories: [] });
                    break;
                case "editCategory": {
                    const c = nd.categories.find(x => x.id === catId);
                    if (c) { c.name = nameVal || c.name; c.icon = iconVal || c.icon; }
                    break;
                }
                case "addSubcat": {
                    if (!nameVal) return;
                    const c = nd.categories.find(x => x.id === catId);
                    const ns = { id: genId(), name: nameVal, links: [] };
                    if(c) {
                        c.subcategories.push(ns);
                        activeSub = ns.id;
                    }
                    break;
                }
                case "editSubcat": {
                    const c = nd.categories.find(x => x.id === catId);
                    const s = c ? c.subcategories.find(x => x.id === subId) : null;
                    if (s) s.name = nameVal || s.name;
                    break;
                }
                case "addLink": {
                    if (!nameVal || !urlVal) return;
                    const c = nd.categories.find(x => x.id === catId);
                    const s = c ? c.subcategories.find(x => x.id === subId) : null;
                    if(s) s.links.push({ id: genId(), name: nameVal, url: urlVal, description: descVal || "" });
                    break;
                }
                case "editLink": {
                    const c = nd.categories.find(x => x.id === catId);
                    const s = c ? c.subcategories.find(x => x.id === subId) : null;
                    const l = s ? s.links.find(x => x.id === linkId) : null;
                    if (l) { l.name = nameVal || l.name; l.url = urlVal || l.url; l.description = descVal ?? l.description; }
                    break;
                }
            }
            save(nd);
            closeModal("crudModal");
        }

        // Eliminaciones directas
        function delCategory(catId) {
            if (!confirm("¿Eliminar esta categoría y todo su contenido?")) return;
            const nc = data.categories.filter(c => c.id !== catId);
            const nd = { ...data, categories: nc };
            if (activeCat === catId) { 
                activeCat = nd.categories[0] ? nd.categories[0].id : null; 
                activeSub = (nd.categories[0] && nd.categories[0].subcategories[0]) ? nd.categories[0].subcategories[0].id : null; 
            }
            save(nd);
        }

        function delSubcat(catId, subId) {
            if (!confirm("¿Eliminar esta subcarpeta?")) return;
            const nd = JSON.parse(JSON.stringify(data));
            const c = nd.categories.find(x => x.id === catId);
            if(c) {
                c.subcategories = c.subcategories.filter(s => s.id !== subId);
                if (activeSub === subId) activeSub = c.subcategories[0] ? c.subcategories[0].id : null;
            }
            save(nd);
        }

        function delLink(catId, subId, linkId) {
            if (!confirm("¿Eliminar este enlace?")) return;
            const nd = JSON.parse(JSON.stringify(data));
            const c = nd.categories.find(x => x.id === catId);
            const s = c ? c.subcategories.find(x => x.id === subId) : null;
            if (s) s.links = s.links.filter(l => l.id !== linkId);
            save(nd);
        }
    </script>
</body>
</html>
